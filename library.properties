sentence=An articulatory singing voice for the Teensy Audio Library: you move a mouth, and the sound is the consequence.
paragraph=Articulatory synthesis on a Teensy 4.1: air moving through a 22-section Kelly-Lochbaum tube shaped like a vocal tract (the tube and its Liljencrants-Fant glottis adapted from Pink Trombone). The whole control surface is pose targets on a small body — lungs, larynx, tongue, lips, velum, two free constrictions — each easing toward its target at its own rate; vowels, glides, nasals, stops, bursts and hiss fall out of where the tube is wide, narrow, closed or opening. Playable live, or scriptable: ARPABET words sung on notes compile to the same targets. One AudioStream object (AudioSynthMonkMouth), four voices at once; the engine (mm::Voice) is platform-agnostic and host-testable.
category=Signal Input/Output
